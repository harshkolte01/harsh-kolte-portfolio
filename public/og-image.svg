<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Source for og-image.png. Fonts: Geist, Geist Mono, Instrument Serif (Google Fonts). -->
  <defs>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <rect x="12" y="12" width="1.4" height="1.4" fill="#edece6" fill-opacity="0.14" />
    </pattern>
    <radialGradient id="fade" cx="0.72" cy="0.32" r="0.7">
      <stop offset="0" stop-color="#fff" stop-opacity="1" />
      <stop offset="1" stop-color="#fff" stop-opacity="0" />
    </radialGradient>
    <mask id="dotmask">
      <rect width="1200" height="630" fill="url(#fade)" />
    </mask>
    <radialGradient id="glow" cx="1" cy="0" r="0.75">
      <stop offset="0" stop-color="#ff5b24" stop-opacity="0.16" />
      <stop offset="1" stop-color="#ff5b24" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#0b0b0a" />
  <rect width="1200" height="630" fill="url(#glow)" />
  <rect width="1200" height="630" fill="url(#dots)" mask="url(#dotmask)" />

  <circle cx="114" cy="96" r="22" fill="#edece6" />
  <text x="114" y="101.5" text-anchor="middle" font-family="Geist Mono" font-size="15" fill="#0b0b0a">HK</text>
  <text x="152" y="104" font-family="Geist" font-weight="500" font-size="25" letter-spacing="-0.5" fill="#edece6">Harsh Kolte</text>

  <circle cx="740" cy="96" r="5" fill="#4ade80" />
  <text x="1108" y="102" text-anchor="end" font-family="Geist Mono" font-size="17" fill="#a3a29b">Open for freelance &amp; contract work</text>

  <g font-family="Geist" font-weight="500" font-size="86" letter-spacing="-3.6" fill="#edece6">
    <text x="88" y="296">I build AI agents,</text>
    <text x="88" y="386"><tspan font-family="Instrument Serif" font-style="italic" font-weight="400" letter-spacing="-1" fill="#ff5b24">desktop apps</tspan> &amp; the web</text>
    <text x="88" y="476">around them.</text>
  </g>

  <rect x="92" y="534" width="1016" height="1" fill="#edece6" fill-opacity="0.12" />
  <text x="92" y="578" font-family="Geist Mono" font-size="17" fill="#a3a29b">AgentForge · CapturePro · WATabs · HDF Viewer (ISRO SAC)</text>
  <text x="1108" y="578" text-anchor="end" font-family="Geist Mono" font-size="17" fill="#edece6">Freelance full-stack developer</text>
</svg>
